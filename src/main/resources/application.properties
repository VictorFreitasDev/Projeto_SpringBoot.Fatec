spring.datasource.url=jdbc:h2:mem:feiraviva;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 (habilitado pelo spring-boot-starter-h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — Flyway assume o controle do esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (habilitado pelo spring-boot-starter-flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT — segredo HS256 exige no mínimo 32 caracteres (256 bits)
app.jwt.secret=feira-viva-chave-secreta-super-segura-2026-minimo-32-caracteres!
app.jwt.expiration-ms=3600000